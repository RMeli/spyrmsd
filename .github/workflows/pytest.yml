name: pytest

on:
  push:
    branches:
      - "develop"
      - "master"
  pull_request:
    branches:
      - "*"
  schedule:
    # Nightly tests (on master)
    - cron: "0 0 * * *"

jobs:
  test:
    name: Test ${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.chemlib }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        chemlib: [rdkit]

    steps:
    - uses: actions/checkout@v5

    - name: Info
      shell: bash
      run: |
        uname -a
        df -h
        ulimit -a

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install base dependencies
      run: |
        uv pip install --system numpy scipy networkx rustworkx pebble pytest pytest-cov pytest-benchmark

    - name: Install chemistry library (rdkit)
      if: matrix.chemlib == 'rdkit'
      run: |
        uv pip install --system rdkit

    - name: Install package
      run: |
        uv pip install --system -e . --no-deps

    - name: Show environment
      run: |
        python --version
        uv pip list

    - name: Test
      run: |
        pytest -v --benchmark --cov=spyrmsd --cov-report=xml --color=yes tests/

    - name: CodeCov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.chemlib }}
